name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint
        run: |
          ruff check app tests

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=app/services --cov=app/api --cov-fail-under=85 --cov-report=term-missing

      - name: Run Node Frontend Unit Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/frontend_tests/*.mjs
